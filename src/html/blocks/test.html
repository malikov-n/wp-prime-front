<section class="test">
  <div class="container-full">
    <div class="test__inner">
      <picture>
        <source media="(max-width: 820px)" srcset="./../../img/test-bg@2x.jpg">
        <img src="./../../img/test-inner@2x.jpg" alt="">
      </picture>
      <div class="test__content-box">
        <h2 class="test__title">
          Оцените свое текущее эмоциональное состояние 
          <span>по шкале HADS</span>
        </h2>
        <p class="test__description">
          Ответьте на несколько вопросов и получите предварительную оценку эмоционального состояния.Тест поможет понять, стоит ли
          обратиться к специалисту.
        </p>
        <button class="test__btn btn">
          Пройти тест
          <span>
            <svg width="14" height="15" viewBox="0 0 14 15" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="6.95653" y1="0.5" x2="6.95653" y2="13.587" stroke="#42606A" stroke-linecap="round" />
              <line x1="0.5" y1="6.54297" x2="13" y2="6.54297" stroke="#42606A" stroke-linecap="round" />
            </svg>
          </span>
        </button>
      </div>
    </div>
  </div>
</section>
